<!DOCTYPE html>
<html>
<head>
  <title>Vocabolario</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <style>
    #progress-bar { width: 200px; height: 20px; background-color: #ccc; border-radius: 10px; }
    #progress-bar-fill { height: 20px; background-color: #4CAF50; border-radius: 10px; }
    #file-input-label { font-size: 18px; padding: 10px 20px; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; }
    #group-list { font-size: 18px; padding: 10px 20px; }
    #prev-card, #next-card { font-size: 24px; padding: 15px 30px; }
    #card { width: 40%; margin: 40px auto; font-size: 52px; display: flex; justify-content: center; align-items: center; height: 300px; }
    @media only screen and (max-width: 768px) {
      #card { width: 90%; font-size: 33.8px; height: 250px; }
    }
  </style>
</head>
<body>
  <h1>Vocabolario</h1>
  <p style="text-align: center;">Hai trovato una parola sbagliata? Invia un'email a </p>
  <a href="mailto:rodns01@gmail.com?subject=Correzione"><p style="text-align:center">rodns01@gmail.com</p></a>
  <label for="file-input" id="file-input-label">Caricare</label>
  <input type="file" id="file-input" style="display: none;" accept=".txt">
  <div id="progress-bar"><div id="progress-bar-fill" style="width: 0%;"></div></div>
  <p id="progress-text">0.00%</p>
  <select id="group-list"></select>
  <div>
    <button id="prev-card">precedente</button>
    <button id="next-card">successivo</button>
    <div id="card"></div>
  </div>

  <script>
    let flashcards = {};
    let currentGroup = null;
    let currentCardIndex = 0;

    function getLessonFromURL() {
      const params = new URLSearchParams(window.location.search);
      const val = params.get('lezione') || params.get('lesson');
      return val ? String(val) : null;
    }

    function loadFlashcards(file) {
      let reader = new FileReader();
      reader.onload = function(event) {
        let lines = event.target.result.split("\n");
        flashcards = {};
        let currentNum = "";
        
        lines.forEach(line => {
          if (line.match(/^(Lezione|Grupo)/)) {
            currentNum = line.replace(/\D/g, "").trim();
            if(currentNum) flashcards[currentNum] = [];
          } else if (currentNum && line.trim() !== "") {
            let sides = line.split("-");
            if (sides.length === 2) {
              flashcards[currentNum].push({ pergunta: sides[0].trim(), risposta: sides[1].trim() });
            }
          }
        });
        showGroups();
      };
      reader.readAsText(file);
    }

    function showGroups() {
      const titulos = { "3": "L'ORA E LE PARTI DEL GIORNO", "4": "I GIORNI, I MESI E LE STAGIONI", "5": "GLI ANNI E I SECOLI", "6": "LE FESTE LE PREPOSIZIONI", "7": "LE PREPOSIZIONI", "8": "LE FORME", "9": "LE PERSONE", "10": "LA FAMIGLIA E I PARENTI", "11": "IL CORPO UMANO", "12": "IL CORPO UMANO", "13": "LE CARATTERISTICHE FISICHE", "14": "I VESTITI", "15": "GLI ACCESSORI E LE CALZATURE", "16": "LA BIANCHERIA", "17": "I GIOIELLI E I COSMETICI", "18": "LA DESCRIZIONE DEI VESTITI E I MATERIALI", "19": "LA CASA", "20": "IL SOGGIORNO", "21": "LA CUCINA", "22": "VERBI PER LA CUCINA", "23": "LA STANZA DA LETTO", "24": "LA CAMERA DEL BAMBINO", "25": "IL BAGNO", "26": "IL RIPOSTIGLIO", "27": "I LAVORI DI CASA", "28": "A CASA", "29": "AL SUPERMERCATO", "30": "LE VERDURE", "31": "LA FRUTTA", "32": "I CONTENITORI", "33": "I SOLDI E LA BANCA", "34": "I MESTIERI", "35": "IL TEMPO LIBERO", "36": "GLI HOBBY", "37": "GLI STRUMENTI MUSICALI", "38": "GLI UTENSILI", "39": "AL RISTORANTE", "40": "AL BAR", "41": "DAL MEDICO", "42": "DAL DENTISTA", "43": "LE MALATTIE", "44": "I VERBI", "45": "LE CURE", "46": "L'OSPEDALE", "47": "LA CLASSE", "48": "I VERBI PER LA SCUOLA", "49": "IN UFFICIO", "50": "LA POSTA", "51": "GLI SPORT", "52": "IL CALCIO", "53": "LA GIUSTIZIA", "54": "LA CITTÀ", "55": "L'AUTOSTRADA", "56": "I SEGNALI STRADALI", "57": "L'AEREOPORTO", "58": "I TRASPORTI", "59": "L'AUTOMOBILE", "60": "LA BICICLETTA", "61": "LA CAMPAGNA", "62": "IL GIARDINO", "63": "GLI UCCELLI", "64": "GLI ANIMALI MARINI", "65": "GLI ANIMALI", "66": "IL MONDO", "67": "L'EUROPA", "68": "L'ITALIA", "69": "L'UNIVERSO", "70": "DESCRIZIONE DEL TEMPO", "71": "LA TERRA", "72": "IL MARE", "73": "I COLORI" };
      
      let groupList = document.getElementById("group-list");
      groupList.onchange = null;
      groupList.innerHTML = "";
      
      Object.keys(flashcards).forEach(num => {
        let opt = document.createElement("option");
        opt.value = num;
        opt.text = `Lezione ${num} ${titulos[num] ? "- " + titulos[num] : ""}`;
        groupList.appendChild(opt);
      });

      let lessonFromURL = getLessonFromURL();
      currentGroup = (lessonFromURL && flashcards[lessonFromURL]) ? lessonFromURL : Object.keys(flashcards)[0];
      groupList.value = currentGroup;
      
      showCard();
      groupList.onchange = showFlashcards;
    }

    function showFlashcards() {
      currentGroup = document.getElementById("group-list").value;
      currentCardIndex = 0;
      window.history.replaceState(null, '', `${window.location.pathname}?lezione=${currentGroup}`);
      showCard();
    }

    function showCard() {
      let card = flashcards[currentGroup][currentCardIndex];
      let p = ((currentCardIndex + 1) / flashcards[currentGroup].length) * 100;
      document.getElementById("progress-bar-fill").style.width = p + "%";
      document.getElementById("progress-text").innerText = p.toFixed(2) + "%";
      document.getElementById("card").innerHTML = `<div style="text-align:center"><p>${card.pergunta}</p><button onclick="document.getElementById('ans').style.display='block'">Risposta</button><div id='ans' style='display:none'>${card.risposta}</div></div>`;
    }

    document.getElementById("next-card").onclick = () => {
      currentCardIndex = (currentCardIndex + 1) % flashcards[currentGroup].length;
      showCard();
    };
    document.getElementById("prev-card").onclick = () => {
      currentCardIndex = (currentCardIndex - 1 + flashcards[currentGroup].length) % flashcards[currentGroup].length;
      showCard();
    };
    document.getElementById("file-input").onchange = (e) => loadFlashcards(e.target.files[0]);

    window.onload = () => {
      fetch('Dizionario per imaggini.txt')
       .then(r => r.text())
       .then(t => loadFlashcards(new File([t], 'arq.txt')))
       .catch(err => console.error(err));
    }
  </script>
</body>
</html>
