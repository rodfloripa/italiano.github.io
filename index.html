<script>
    let flashcards = {};
    let currentGroup = null;
    let currentCardIndex = 0;
    let lezione = null;

    function getLessonFromURL() {
      const params = new URLSearchParams(window.location.search);
      let lesson = params.get('lezione') || params.get('lesson');

      // também aceita #lezione-12a
      if(!lesson && window.location.hash) {
        lesson = window.location.hash.replace('#lezione-', '').replace('#lesson-', '');
      }
      return lesson;
    }

    function loadFlashcards(file) {
      let reader = new FileReader();
      reader.onload = function(event) {
        let txt = event.target.result;
        let lines = txt.split("\n");
        let vocabolario = lines[0].trim();
        lezione = lines[1].trim();
        document.title = vocabolario;
        document.querySelector("h1").innerText = vocabolario;
        txt = txt.replace(/Vocabolario/g, vocabolario);
        txt = txt.replace(/Lezione/g, lezione);
        let group = null;
        let groupName = null;
        lines = txt.split("\n");
        flashcards = {};
        let newFlashcards = {};
        lines.forEach(line => {
          if (line.match(/^(Lezione|Grupo)/)) {
            group = line.trim();
            // MODIFICADO: Captura o número e letras opcionais (ex: 12, 12a, 29e)
            let matchNum = line.trim().match(/(\d+[a-zA-Z]*)/);
            let groupNumber = matchNum ? matchNum[0] : "";
            groupName = lezione + groupNumber;
            flashcards[group] = [];
            newFlashcards[groupName] = [];
          } else if (group && line.trim()!== "") {
            let sides = line.split("-");
            if (sides.length === 2) {
              flashcards[group].push({
                pergunta: sides[0].trim(),
                risposta: sides[1].trim()
              });
              newFlashcards[groupName].push({
                domanda: sides[0].trim(),
                risposta: sides[1].trim()
              });
            }
          }
        });
        flashcards = newFlashcards;
        showGroups();
      };
      reader.readAsText(file);
    }

    function showGroups() {
      let groupList = document.getElementById("group-list");
      const titulos = {
        "3": "L'ORA E LE PARTI DEL GIORNO",
        "4": "I GIORNI, I MESI E LE STAGIONI",
        "5": "GLI ANNI E I SECOLI",
        "6": "LE FESTE LE PREPOSIZIONI",
        "7": "LE PREPOSIZIONI",
        "8": "LE FORME",
        "9": "LE PERSONE",
        "10": "LA FAMIGLIA E I PARENTI",
        "11": "IL CORPO UMANO",
        "12": "IL CORPO UMANO",
        "13": "LE CARATTERISTICHE FISICHE",
        "14": "I VESTITI",
        "15": "GLI ACCESSORI E LE CALZATURE",
        "16": "LA BIANCHERIA",
        "17": "I GIOIELLI E I COSMETICI",
        "18": "LA DESCRIZIONE DEI VESTITI E I MATERIALI",
        "19": "LA CASA",
        "20": "IL SOGGIORNO",
        "21": "LA CUCINA",
        "22": "VERBI PER LA CUCINA",
        "23": "LA STANZA DA LETTO",
        "24": "LA CAMERA DEL BAMBINO",
        "25": "IL BAGNO",
        "26": "IL RIPOSTIGLIO",
        "27": "I LAVORI DI CASA",
        "28": "A CASA",
        "29": "AL SUPERMERCATO",
        "30": "LE VERDURE",
        "31": "LA FRUTTA",
        "32": "I CONTENITORI",
        "33": "I SOLDI E LA BANCA",
        "34": "I MESTIERI",
        "35": "IL TEMPO LIBERO",
        "36": "GLI HOBBY",
        "37": "GLI STRUMENTI MUSICALI",
        "38": "GLI UTENSILI",
        "39": "AL RISTORANTE",
        "40": "AL BAR",
        "41": "DAL MEDICO",
        "42": "DAL DENTISTA",
        "43": "LE MALATTIE",
        "44": "I VERBI",
        "45": "LE CURE",
        "46": "L'OSPEDALE",
        "47": "LA CLASSE",
        "48": "I VERBI PER LA SCUOLA",
        "49": "IN UFFICIO",
        "50": "LA POSTA",
        "51": "GLI SPORT",
        "52": "IL CALCIO",
        "53": "LA GIUSTIZIA",
        "54": "LA CITTÀ",
        "55": "L'AUTOSTRADA",
        "56": "I SEGNALI STRADALI",
        "57": "L'AEREOPORTO",
        "58": "I TRASPORTI",
        "59": "L'AUTOMOBILE",
        "60": "LA BICICLETTA",
        "61": "LA CAMPAGNA",
        "62": "IL GIARDINO",
        "63": "GLI UCCELLI",
        "64": "GLI ANIMALI MARINI",
        "65": "GLI ANIMALI",
        "66": "IL MONDO",
        "67": "L'EUROPA",
        "68": "L'ITALIA",
        "69": "L'UNIVERSO",
        "70": "DESCRIZIONE DEL TEMPO",
        "71": "LA TERRA",
        "72": "IL MARE",
        "73": "I COLORI"
      };

      groupList.innerHTML = "";
      Object.keys(flashcards).forEach(group => {
        let match = group.match(/(\d+[a-zA-Z]*)/);
        let groupNumber = match ? match[0] : "";
        // Tenta buscar no dicionário pelo número base (ex: "12") caso a chave completa não exista
        let baseNumMatch = groupNumber.match(/\d+/);
        let baseNum = baseNumMatch ? baseNumMatch[0] : groupNumber;
        let titulo = titulos[groupNumber] || titulos[baseNum] || "";
        
        let option = document.createElement("option");
        option.value = group;
        option.text = `${group} - ${titulo}`;
        groupList.appendChild(option);
      });

      document.getElementById("group-list").onchange = showFlashcards;

      // Verifica se veio lezione na URL (suportando letras)
      let lessonFromURL = getLessonFromURL();
      let targetGroup = null;

      if(lessonFromURL) {
        targetGroup = Object.keys(flashcards).find(g => g.toLowerCase().includes(lessonFromURL.toLowerCase()));
      }

      groupList.value = targetGroup || Object.keys(flashcards)[1];
      showFlashcards();
    }

    function showFlashcards() {
      currentGroup = document.getElementById("group-list").value;
      currentCardIndex = 0;
      showCard();

      // MODIFICADO: Atualiza a URL mantendo a letra (ex: ?lezione=12a)
      let match = currentGroup.match(/(\d+[a-zA-Z]*)/);
      if(match) {
        let lessonNum = match[0];
        const newUrl = `${window.location.pathname}?lezione=${lessonNum}`;
        window.history.replaceState(null, '', newUrl);
      }
    }

    function showCard() {
      let card = flashcards[currentGroup][currentCardIndex];
      let progresso = ((currentCardIndex + 1) / flashcards[currentGroup].length) * 100;
      document.getElementById("progress-bar-fill").style.width = `${progresso}%`;
      document.getElementById("progress-text").innerText = `${progresso.toFixed(2)}%`;
      document.getElementById("card").innerHTML = `
        <div style="background-color: yellow; padding: 10px; text-align: center; font-size: inherit; line-height: 1; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column;">
          <p>${card.domanda}</p>
          <button onclick="showAnswer()" style="font-size: 36px;">Risposta</button>
          <div id="answer" style="max-height: 0; overflow: hidden; transition: max-height 0.5s ease-out; font-size: inherit;">${card.risposta}</div>
        </div>
      `;
    }

    function showAnswer() {
      let answer = document.getElementById("answer");
      if (answer.style.maxHeight === "0px" || answer.style.maxHeight === "") {
        answer.style.maxHeight = "500px";
        answer.style.transition = "max-height 0.5s ease-in";
      } else {
        answer.style.maxHeight = "0px";
        answer.style.transition = "max-height 0.5s ease-out";
      }
    }

    function nextCard() {
      currentCardIndex++;
      if (currentCardIndex >= flashcards[currentGroup].length) {
        let groups = Object.keys(flashcards);
        let currentIndex = groups.indexOf(currentGroup);
        if (currentIndex === groups.length - 1) {
          currentIndex = 0;
        } else {
          currentIndex++;
        }
        currentGroup = groups[currentIndex];
        currentCardIndex = 0;
        document.getElementById("group-list").value = currentGroup;
      }
      showCard();
    }

    function prevCard() {
      currentCardIndex--;
      if (currentCardIndex < 0) {
        let groups = Object.keys(flashcards);
        let currentIndex = groups.indexOf(currentGroup);
        if (currentIndex === 0) {
          currentIndex = groups.length - 1;
        } else {
          currentIndex--;
        }
        currentGroup = groups[currentIndex];
        currentCardIndex = flashcards[currentGroup].length - 1;
        document.getElementById("group-list").value = currentGroup;
      }
      showCard();
    }

    document.getElementById("file-input").addEventListener("change", function(event) {
      loadFlashcards(event.target.files[0]);
    });

    document.getElementById("next-card").onclick = nextCard;
    document.getElementById("prev-card").onclick = prevCard;

    window.onload = function() {
      fetch('Dizionario per imaggini.txt')
       .then(response => response.text())
       .then(text => {
          let file = new File([text], 'arq.txt', {
            type: 'text/plain'
          });
          loadFlashcards(file);
       })
       .catch(error => console.error('Erro ao carregar arquivo:', error));
    }
  </script>
