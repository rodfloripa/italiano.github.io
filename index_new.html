<!DOCTYPE html>
<html lang="pt-br">
<head>
  <title>Vocabolario</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dizionario per immagini traduzido">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Inter:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Inter',sans-serif;background:#0F0F0F;color:#fff}
   .card{background:#242424;border-radius:24px}
    #header-img{max-width:100%;height:auto}
  </style>
</head>
<body class="min-h-screen max-w-[480px] mx-auto px-4 py-4">

  <!-- CAPA + PROGRESSO -->
  <div class="card p-4 mb-4">
    <div class="flex justify-center mb-5">
      <img src="diz.jpg" id="header-img" class="w-[240px] rounded-[16px]" alt="DIZIONARIO PER IMMAGINI">
    </div>
    <div class="flex justify-between text-[13px] mb-2">
      <span class="text-zinc-400">Progresso</span>
      <span id="progress-text" class="text-[#7CB87C] font-bold">0% • 0 di 0</span>
    </div>
    <div class="w-full h-[12px] bg-[#333] rounded-full overflow-hidden">
      <div id="progress-bar-fill" class="h-full bg-gradient-to-r from-[#2E7D32] to-[#C6A500] rounded-full transition-all duration-500" style="width:0%"></div>
    </div>
  </div>

  <!-- LIÇÃO -->
  <div class="card p-3 mb-5">
    <div class="relative">
      <select id="group-list" class="w-full bg-[#333] text-white text-[14px] font-bold p-3 pr-10 rounded-xl outline-none appearance-none"></select>
      <div class="pointer-events-none absolute right-3 top-[10px] w-7 h-7 bg-[#C6A500] rounded-full flex items-center justify-center text-black text-[12px]">▼</div>
    </div>
    <div class="flex gap-3 mt-3">
      <button id="prev-card" class="flex-1 h-11 rounded-full bg-[#2E7D32] text-white font-bold text-[14px]">precedente</button>
      <button id="next-card" class="flex-1 h-11 rounded-full bg-[#C6A500] text-black font-extrabold text-[14px]">successivo</button>
    </div>
  </div>

  <!-- CARD -->
  <div class="card p-6 text-center min-h-[380px] flex flex-col justify-between">
    <div id="card" class="flex-1 flex flex-col justify-center"></div>
  </div>

<script>
let flashcards={},currentGroup=null,currentCardIndex=0,lezione=null;

function getLessonFromURL(){
  const p=new URLSearchParams(window.location.search);
  let l=p.get('lezione')||p.get('lesson');
  if(!l&&window.location.hash) l=window.location.hash.replace('#lezione-','').replace('#lesson-','');
  return l;
}

function loadFlashcards(file){
  let reader=new FileReader();
  reader.onload=function(e){
    let txt=e.target.result;
    let lines=txt.split("\n");
    let vocabolario=lines[0].trim();
    lezione=lines[1].trim();
    document.title=vocabolario;
    txt=txt.replace(/Vocabolario/g,vocabolario).replace(/Lezione/g,lezione);
    lines=txt.split("\n");
    let group=null,groupName=null;
    flashcards={}; let newFlashcards={};
    lines.forEach(line=>{
      if(line.match(/^(Lezione|Grupo)/)){
        group=line.trim();
        let m=line.trim().match(/(\d+[a-zA-Z]*)/);
        let gn=m?m[0]:"";
        groupName=lezione+gn;
        flashcards[group]=[]; newFlashcards[groupName]=[];
      }else if(group&&line.trim()!==""){
        let sides=line.split("-");
        if(sides.length===2){
          newFlashcards[groupName].push({domanda:sides[0].trim(),risposta:sides[1].trim()});
        }
      }
    });
    flashcards=newFlashcards;
    showGroups();
  };
  reader.readAsText(file);
}

function showGroups(){
  let groupList=document.getElementById("group-list");
  const titulos={"3":"L'ORA E LE PARTI DEL GIORNO","4":"I GIORNI, I MESI E LE STAGIONI","5":"GLI ANNI E I SECOLI","6":"LE FESTE LE PREPOSIZIONI","7":"LE PREPOSIZIONI","8":"LE FORME","9":"LE PERSONE","10":"LA FAMIGLIA E I PARENTI","11":"IL CORPO UMANO","12":"IL CORPO UMANO","13":"LE CARATTERISTICHE FISICHE","14":"I VESTITI","15":"GLI ACCESSORI E LE CALZATURE","16":"LA BIANCHERIA","17":"I GIOIELLI E I COSMETICI","18":"LA DESCRIZIONE DEI VESTITI E I MATERIALI","19":"LA CASA","20":"IL SOGGIORNO","21":"LA CUCINA","22":"VERBI PER LA CUCINA","23":"LA STANZA DA LETTO","24":"LA CAMERA DEL BAMBINO","25":"IL BAGNO","26":"IL RIPOSTIGLIO","27":"I LAVORI DI CASA","28":"A CASA","29":"AL SUPERMERCATO","30":"LE VERDURE","31":"LA FRUTTA","32":"I CONTENITORI","33":"I SOLDI E LA BANCA","34":"I MESTIERI","35":"IL TEMPO LIBERO","36":"GLI HOBBY","37":"GLI STRUMENTI MUSICALI","38":"GLI UTENSILI","39":"AL RISTORANTE","40":"AL BAR","41":"DAL MEDICO","42":"DAL DENTISTA","43":"LE MALATTIE","44":"I VERBI","45":"LE CURE","46":"L'OSPEDALE","47":"LA CLASSE","48":"I VERBI PER LA SCUOLA","49":"IN UFFICIO","50":"LA POSTA","51":"GLI SPORT","52":"IL CALCIO","53":"LA GIUSTIZIA","54":"LA CITTÀ","55":"L'AUTOSTRADA","56":"I SEGNALI STRADALI","57":"L'AEREOPORTO","58":"I TRASPORTI","59":"L'AUTOMOBILE","60":"LA BICICLETTA","61":"LA CAMPAGNA","62":"IL GIARDINO","63":"GLI UCCELLI","64":"GLI ANIMALI MARINI","65":"GLI ANIMALI","66":"IL MONDO","67":"L'EUROPA","68":"L'ITALIA","69":"L'UNIVERSO","70":"DESCRIZIONE DEL TEMPO","71":"LA TERRA","72":"IL MARE","73":"I COLORI"};
  groupList.innerHTML="";
  Object.keys(flashcards).forEach(g=>{
    let match=g.match(/(\d+[a-zA-Z]*)/);
    let groupNumber=match?match[0]:"";
    let base=groupNumber.match(/\d+/);
    let baseNum=base?base[0]:groupNumber;
    let titulo=titulos[groupNumber]||titulos[baseNum]||"";
    let o=document.createElement("option");
    o.value=g; o.text=`${g} - ${titulo}`;
    groupList.appendChild(o);
  });
  groupList.onchange=showFlashcards;
  let lessonFromURL=getLessonFromURL();
  let target=lessonFromURL?Object.keys(flashcards).find(k=>k.includes(lessonFromURL)):null;
  groupList.value=target||Object.keys(flashcards)[1]||Object.keys(flashcards)[0];
  showFlashcards();
}

function showFlashcards(){
  currentGroup=document.getElementById("group-list").value;
  currentCardIndex=0;
  showCard();
  let m=currentGroup.match(/(\d+[a-zA-Z]*)/);
  if(m) history.replaceState(null,'',`${location.pathname}?lezione=${m[0]}`);
}

function showCard(){
  let card=flashcards[currentGroup][currentCardIndex];
  let total=flashcards[currentGroup].length;
  let progresso=((currentCardIndex+1)/total)*100;

  // SEM DECIMAIS
  document.getElementById("progress-bar-fill").style.width=`${progresso}%`;
  document.getElementById("progress-text").innerText=`${Math.round(progresso)}% • ${currentCardIndex+1} di ${total}`;

  // FONTE MENOR IGUAL PARA PT E IT + 3 PONTOS
  document.getElementById("card").innerHTML=`
    <div class="w-full flex flex-col items-center">
      <p style="font-family:'Nunito'" class="text-[32px] font-bold text-white leading-tight">${card.domanda}</p>

      <button id="btnRisposta" onclick="showAnswer()" class="mt-8 w-full max-w-[320px] h-[56px] bg-[#C6A500] rounded-[16px] text-black font-extrabold text-[18px] flex items-center justify-center gap-2">
        💡 Risposta
      </button>

      <div id="answer" class="hidden mt-6 text-[32px] font-bold text-white leading-tight" style="font-family:'Nunito'">${card.risposta}</div>

      <div class="flex justify-center gap-2 mt-10">
        <div class="w-2.5 h-2.5 rounded-full bg-white"></div>
        <div class="w-2.5 h-2.5 rounded-full border border-zinc-500"></div>
        <div class="w-2.5 h-2.5 rounded-full border border-zinc-500"></div>
      </div>
    </div>
  `;
}

function showAnswer(){
  document.getElementById("answer").classList.remove('hidden');
  document.getElementById("btnRisposta").classList.add('hidden');
}

function nextCard(){
  currentCardIndex++;
  if(currentCardIndex>=flashcards[currentGroup].length){
    let gs=Object.keys(flashcards);
    let i=gs.indexOf(currentGroup);
    currentGroup=gs[i===gs.length-1?0:i+1];
    currentCardIndex=0;
    document.getElementById("group-list").value=currentGroup;
  }
  showCard();
}
function prevCard(){
  currentCardIndex--;
  if(currentCardIndex<0){
    let gs=Object.keys(flashcards);
    let i=gs.indexOf(currentGroup);
    currentGroup=gs[i===0?gs.length-1:i-1];
    currentCardIndex=flashcards[currentGroup].length-1;
    document.getElementById("group-list").value=currentGroup;
  }
  showCard();
}

document.getElementById("next-card").onclick=nextCard;
document.getElementById("prev-card").onclick=prevCard;

window.onload=function(){
  fetch('Dizionario per imaggini.txt').then(r=>r.text()).then(t=>{
    let f=new File([t],'arq.txt',{type:'text/plain'});
    loadFlashcards(f);
  });
}
</script>
</body>
</html>
